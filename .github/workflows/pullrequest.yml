name: PR validation

on:
  pull_request:
    branches: [ "master" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - run: touch ./internal/runner/config.json

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.27.2'

    - name: Set up Tinygo
      uses: acifani/setup-tinygo@v2
      with:
        tinygo-version: '0.43.0'

    - name: Checks
      run: |
        go version
        tinygo version

    - name: Build
      run: tinygo build -o build.uf2 -target=pico-w -size full ./cmd/rpi_led_com